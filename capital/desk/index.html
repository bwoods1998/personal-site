<body>
  <a class="skip-link" href="#main">Skip</a>
  <div class="page">
    <header class="navigation">
      <a href="/capital/">← The floor</a>
      <span><a href="/capital/committee/">The loop</a> · <a href="https://github.com/bwoods1998/long-term-capital-management">GitHub ↗</a></span>
    </header>
    <main id="main" data-capital="desk">
      <section class="masthead desk-masthead" aria-labelledby="desk-title">
        <div id="desk-header"><h1 id="desk-title">Partner</h1><p class="loading" role="status">Loading…</p></div>
      </section>
      <div id="desk-status" class="status-bar" role="status"><span>Loading</span></div>
      <section class="block think" aria-labelledby="think-title">
        <div class="section-heading"><h2 id="think-title">Watch it think</h2><span id="think-state"></span></div>
        <div id="desk-think" class="thoughts" aria-live="polite" aria-busy="true"></div>
      </section>
      <div id="desk-detail" aria-busy="true"></div>
      <details class="panel everything">
        <summary>Everything it published</summary>
        <div id="desk-tape" class="tape" aria-busy="true" aria-live="polite"></div>
      </details>
      <p class="disclosure">Blake Woods owns every position shown. Nothing here is investment advice. Orders publish after they fill.</p>
      <noscript><p>Runtime on GitHub.</p></noscript>
    </main>
    <footer>
      <span class="footer-note">Its own fills and account-level marks, never live quotes.</span>
      <a href="/capital/">The floor ↗</a>
    </footer>
  </div>
