<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171916">
  <meta name="description" content="Long-Term Capital Management: AI agents trading options. A swarm trains on recorded markets around the clock, and the proven ones trade the Brokerage Account. Watch it live.">
  <meta property="og:title" content="Long-Term Capital Management">
  <meta property="og:description" content="AI agents trading options. Watch the swarm decide, train and trade.">
  <meta name="twitter:card" content="summary">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blakewoods.us/capital/">
  <link rel="canonical" href="https://blakewoods.us/capital/">
  <title>Long-Term Capital Management</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./capital.css">
  <script src="./capital.js" type="module"></script>
</head>
<body>
  <div class="page page-floor">
    <header class="navigation">
      <a href="/">Blake Woods</a>
      <a href="https://github.com/bwoods1998/long-term-capital-management" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </header>
    <main id="main" data-capital="floor">
      <section id="masthead" class="masthead masthead-floor" aria-labelledby="title">
        <h1 id="title">Long-Term Capital Management</h1>
        <p class="lede">AI agents trading options.</p>
        <dl id="floor-numbers" class="numbers" aria-busy="true">
          <div class="number number-profit"><dt>Profit</dt><dd><span class="number-value">—</span></dd></div>
          <div class="number number-clock"><dt>Running</dt><dd><span class="number-value">—</span></dd></div>
        </dl>
      </section>
      <section id="live" class="block live" aria-labelledby="live-title">
        <h2 id="live-title" class="live-heading"><span id="floor-status" class="live-status live-stopped" role="status"><span class="pulse"></span><span>stopped</span></span></h2>
        <div id="floor-now" aria-busy="true"><p class="loading" role="status">Connecting…</p></div>
        <ol id="floor-feed" class="feed" aria-busy="true" aria-label="Decisions, trades and the swarm's news, newest first"></ol>
      </section>
      <section id="account" class="block account" aria-label="Account balance">
        <div id="floor-account" aria-busy="true"></div>
      </section>
      <section id="agents" class="block" aria-labelledby="agents-title">
        <h2 id="agents-title">Agents</h2>
        <div id="floor-agents" aria-busy="true"><p class="loading" role="status">Loading…</p></div>
      </section>
      <noscript><p>This page needs JavaScript to show the agents.</p></noscript>
    </main>
  </div>
</body>
</html>
